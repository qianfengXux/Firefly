<svg xmlns="http://www.w3.org/2000/svg" width="680" height="229" viewBox="0 0 680 229" role="img" aria-label="相机标定与同步像点共同进入三角测量">
<title>相机标定与同步像点共同进入三角测量</title>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#1756a9"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#a64b16"/></marker></defs>
<style>text {font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:17px;fill:#18253b}</style>
<rect width="680" height="229" fill="#fff"/>
<rect x="21" y="23" width="193" height="61" rx="8" fill="#eaf2fc" stroke="#58667b"/><text x="117.5" y="46.5" text-anchor="middle">标定 TOML</text><text x="117.5" y="70.5" text-anchor="middle">各相机 K、D、R、t</text>
