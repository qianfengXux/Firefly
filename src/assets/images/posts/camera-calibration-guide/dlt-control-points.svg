<svg xmlns="http://www.w3.org/2000/svg" id="dlt-control-points" viewBox="0 0 320 150" width="640" height="300" role="img" aria-labelledby="dlt-control-points-title dlt-control-points-desc">
<title id="dlt-control-points-title">三维 DLT 点对应</title><desc id="dlt-control-points-desc">两个不同深度平面上的已知点分别对应图像上的观测点。</desc>
<style>
#dlt-control-points text {fill:#172033;font:14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}
#dlt-control-points .s,#dlt-control-points .d {stroke:#697486;fill:none;stroke-width:1;vector-effect:non-scaling-stroke}
#dlt-control-points .d {stroke-dasharray:4 4}
#dlt-control-points .a,#dlt-control-points .b {fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
#dlt-control-points .a {stroke:#1756a9}
#dlt-control-points .b {stroke:#a64b16;stroke-dasharray:4 3}
#dlt-control-points .p {fill:#1756a9}
#dlt-control-points .q {fill:#a64b16}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
