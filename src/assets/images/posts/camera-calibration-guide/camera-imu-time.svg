<svg xmlns="http://www.w3.org/2000/svg" id="camera-imu-time" viewBox="0 0 320 150" width="640" height="300" role="img" aria-labelledby="camera-imu-time-title camera-imu-time-desc">
<title id="camera-imu-time-title">相机和 IMU 时间偏移</title><desc id="camera-imu-time-desc">斜虚线把相机采样事件和 IMU 时钟下对应的时刻相连。</desc>
<style>
#camera-imu-time text {fill:#172033;font:14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif}
#camera-imu-time .s,#camera-imu-time .d {stroke:#697486;fill:none;stroke-width:1;vector-effect:non-scaling-stroke}
#camera-imu-time .d {stroke-dasharray:4 4}
#camera-imu-time .a,#camera-imu-time .b {fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
#camera-imu-time .a {stroke:#1756a9}
#camera-imu-time .b {stroke:#a64b16;stroke-dasharray:4 3}
#camera-imu-time .p {fill:#1756a9}
#camera-imu-time .q {fill:#a64b16}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
